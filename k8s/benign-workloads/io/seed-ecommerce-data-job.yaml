apiVersion: batch/v1
kind: Job
metadata:
  name: seed-ecommerce-data
  namespace: benign-lab
  labels:
    app: seed-ecommerce-data
    pfe.io/workload: benign-io
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-ecommerce-data
        pfe.io/workload: benign-io
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/ecommerce/products /data/ecommerce/orders /data/ecommerce/invoices /data/shared/reports
              for i in $(seq 1 50); do
                echo "product_id=$i,name=item-$i,price=$((10 + i))" > /data/ecommerce/products/product-$i.txt
              done
              for i in $(seq 1 30); do
                echo "order_id=$i,customer=user-$i,status=paid" > /data/ecommerce/orders/order-$i.txt
                echo "invoice_id=$i,total=$((100 + i))" > /data/ecommerce/invoices/invoice-$i.txt
              done
              for i in $(seq 1 20); do
                echo "shared report $i generated by benign workload" > /data/shared/reports/report-$i.txt
              done
              find /data -type f | sort
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: ecommerce
              mountPath: /data/ecommerce
            - name: shared
              mountPath: /data/shared
      volumes:
        - name: ecommerce
          persistentVolumeClaim:
            claimName: pvc-ecommerce
        - name: shared
          persistentVolumeClaim:
            claimName: pvc-shared-benign
