apiVersion: batch/v1
kind: Job
metadata:
  name: filebench-workload
  namespace: benign-lab
  labels:
    app: filebench-workload
    pfe.io/workload: benign-io
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: filebench-workload
        pfe.io/workload: benign-io
    spec:
      restartPolicy: Never
      containers:
        - name: filebench
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends filebench ca-certificates
              mkdir -p /data/filebench
              filebench -f /etc/filebench/webserver.f
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 768Mi
          volumeMounts:
            - name: filebench-data
              mountPath: /data/filebench
            - name: filebench-config
              mountPath: /etc/filebench
      volumes:
        - name: filebench-data
          persistentVolumeClaim:
            claimName: pvc-filebench
        - name: filebench-config
          configMap:
            name: filebench-workload-config
