apiVersion: v1
kind: Pod
metadata:
  name: suspicious-toolbox
  namespace: attack-lab
  labels:
    app: suspicious-toolbox
    pfe.io/scenario: controlled-attack
spec:
  restartPolicy: Never
  containers:
    - name: toolbox
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - sleep 36000
      volumeMounts:
        - name: victims
          mountPath: /victims
  volumes:
    - name: victims
      emptyDir: {}
