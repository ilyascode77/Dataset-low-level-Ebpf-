apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: pfe-ransomware-like-file-activity
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /victims/
                - /tmp/victims/
    - call: security_path_truncate
      syscall: false
      return: true
      args:
        - index: 0
          type: path
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /victims/
                - /tmp/victims/
